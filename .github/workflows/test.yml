name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
          - 26.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: matrix.node-version != '24.x'
        run: pnpm lint && pnpm test

      - name: Run tests with coverage
        if: matrix.node-version == '24.x'
        run: pnpm lint && pnpm coverage

      - name: Verify edge runtime
        if: matrix.node-version == '24.x'
        run: |
          pnpm --dir packages/thinkjs run build:edge-runtime
          git diff --exit-code -- packages/thinkjs/edge/shared.generated.js
          pnpm --dir packages/thinkjs run lint:edge
          pnpm --dir packages/thinkjs run test:edge

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
