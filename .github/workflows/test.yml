name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
          - 26.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Test release package detection
        run: node --test .github/scripts/changed-packages.test.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The SQLite v3 adapter requires Node 24.15+, while other packages still test on Node 22.
      - name: Run tests on Node 22
        if: matrix.node-version == '22.x'
        run: |
          pnpm lint
          pnpm -r --if-present --filter './packages/**' --filter '!think-cache-memcache' --filter '!think-memcache' --filter '!think-mongo' --filter '!think-model-sqlite' test

      - name: Run tests
        if: matrix.node-version == '26.x'
        run: pnpm lint && pnpm test

      - name: Check SQLite minimum Node versions
        if: matrix.node-version == '24.x'
        run: |
          npm exec --yes --package=node@24.15.0 -- node --test packages/think-model-sqlite/test/index.js
          npm exec --yes --package=node@25.7.0 -- node --test packages/think-model-sqlite/test/index.js

      - name: Run tests with coverage
        if: matrix.node-version == '24.x'
        run: pnpm lint && pnpm coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
