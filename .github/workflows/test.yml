name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
          - 26.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: matrix.node-version != '24.x'
        run: pnpm lint && pnpm test

      - name: Run tests with coverage
        if: matrix.node-version == '24.x'
        run: pnpm lint && pnpm coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  typescript-application:
    name: Installed TS application (Node ${{ matrix.node }}, TS ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.x
            typescript: 3.9.10
          - node: 24.x
            typescript: 5.9.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No workspace install: the gate must use packed files and its own real
      # installs, not dependencies or generated types left by another test job.
      - name: Pack, install, compile and boot the TypeScript application
        env:
          THINKJS_APPLICATION_TYPESCRIPT: ${{ matrix.typescript }}
        run: node scripts/typescript-migration/application.cjs

  typescript-template:
    name: Checked TS template (Node ${{ matrix.node }}, TS ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.x
            typescript: 3.9.10
          - node: 24.x
            typescript: 5.9.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Only template rendering consumes workspace CLI dependencies. The generated
      # and production apps install their own packages in independent directories.
      - name: Install template generator dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Create, move, install and run the checked TypeScript template
        env:
          THINKJS_APPLICATION_TYPESCRIPT: ${{ matrix.typescript }}
        run: pnpm test:typescript-template

  typescript-development:
    name: Checked development cache (Node ${{ matrix.node }}, TS ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.x
            typescript: 3.9.10
          - node: 24.x
            typescript: 5.9.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install workspace and isolated comparison compiler
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript }}
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/thinkjs-compiler" --ignore-scripts --no-audit --no-fund --package-lock=false "typescript@$TYPESCRIPT_VERSION"
          echo "THINKJS_AUDIT_TYPESCRIPT=$RUNNER_TEMP/thinkjs-compiler/node_modules/typescript" >> "$GITHUB_ENV"
      - name: Verify checked resources, syntax invalidation and deterministic work budgets
        run: node --test --test-concurrency=1 packages/think-ts-helper/test/development.test.js packages/think-ts-helper/test/benchmark-development.test.js
      # Timing observations are reported, never used as portable pass thresholds.
      - name: Record large generated-contract development costs
        run: |
          mkdir -p "$RUNNER_TEMP/thinkjs-measurements"
          node packages/think-ts-helper/scripts/benchmark-development.js 1000 5 single > "$RUNNER_TEMP/thinkjs-measurements/single.json"
          node packages/think-ts-helper/scripts/benchmark-development.js 1000 5 multi > "$RUNNER_TEMP/thinkjs-measurements/multi.json"
      - name: Upload development measurements
        uses: actions/upload-artifact@v4
        with:
          name: checked-development-node-${{ matrix.node }}-ts-${{ matrix.typescript }}
          path: ${{ runner.temp }}/thinkjs-measurements/*.json
          if-no-files-found: error
