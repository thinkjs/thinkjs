name: Publish changed packages

on:
  push:
    branches:
      - master
    paths:
      - 'packages/*/package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Find packages with version changes
        id: changed_packages
        shell: bash
        run: |
          set -euo pipefail

          before_sha="${{ github.event.before }}"
          if [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
            before_sha="$(git rev-parse HEAD^)"
          fi

          changed_files=$(git diff --name-only "$before_sha" "$GITHUB_SHA" -- 'packages/*/package.json' || true)
          packages=""

          for file in $changed_files; do
            old_version=$(git show "$before_sha:$file" 2>/dev/null | node -p "try { JSON.parse(require('fs').readFileSync(0, 'utf8')).version || '' } catch { '' }")
            new_version=$(node -p "try { require('./$file').version || '' } catch { '' }")

            if [ -n "$new_version" ] && [ "$old_version" != "$new_version" ]; then
              pkg_dir=$(dirname "$file")
              packages="${packages}${pkg_dir}"$'\n'
            fi
          done

          packages=$(printf "%s" "$packages" | sed '/^$/d' | sort -u || true)
          {
            echo "packages<<EOF"
            echo "$packages"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: ${{ steps.changed_packages.outputs.packages != '' }}
        run: pnpm install --frozen-lockfile

      - name: Run checks
        if: ${{ steps.changed_packages.outputs.packages != '' }}
        run: pnpm lint && pnpm test

      - name: Publish changed packages
        if: ${{ steps.changed_packages.outputs.packages != '' }}
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="${RUNNER_TEMP}/npm-packages"
          mkdir -p "$pack_dir"

          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "Packing $pkg"
            pack_json=$(cd "$pkg" && npm pack --json --pack-destination "$pack_dir")
            tarball=$(printf '%s' "$pack_json" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const result = JSON.parse(input);
                if (!result[0]?.filename) process.exit(1);
                process.stdout.write(result[0].filename);
              });
            ')
            tarball_path="${pack_dir}/${tarball}"

            tar -xOf "$tarball_path" package/package.json | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const manifest = JSON.parse(input);
                const fields = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"];
                const invalid = fields.flatMap(field =>
                  Object.entries(manifest[field] || {})
                    .filter(([, spec]) => /^(workspace:|file:)|^\.?\.\//.test(spec))
                    .map(([name, spec]) => `${field}.${name}: ${spec}`)
                );
                if (invalid.length) {
                  console.error(`Local dependency specs found in ${manifest.name}:\n${invalid.join("\n")}`);
                  process.exit(1);
                }
              });
            '

            echo "Publishing $tarball"
            npm publish "$tarball_path" --provenance
          done <<< "${{ steps.changed_packages.outputs.packages }}"
